<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#090d11"/>
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#79c0ff"/>
      <stop offset="100%" stop-color="#388bfd"/>
    </linearGradient>
  </defs>

  <style>
    .bg { fill: url(#bg-grad); }
    .grid-line { stroke: #30363d; stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.3; }
    
    /* Pulse Line Animation */
    .wave {
      fill: none;
      stroke: #3fb950;
      stroke-width: 3;
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      animation: dash 5s linear infinite;
    }

    .wave-bg {
      fill: none;
      stroke: #238636;
      stroke-width: 1.5;
      opacity: 0.4;
    }

    @keyframes dash {
      0% { stroke-dashoffset: 1200; }
      100% { stroke-dashoffset: 0; }
    }

    /* Floating Badges */
    .pill {
      animation: float 4s ease-in-out infinite alternate;
    }
    .pill-delay {
      animation: float 4s ease-in-out 2s infinite alternate;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }

    /* Text Formatting */
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 44px;
      font-weight: 800;
      fill: url(#title-grad);
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 19px;
      font-weight: 400;
      fill: #8b949e;
    }

    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #c9d1d9;
    }
  </style>

  <!-- Background Rect -->
  <rect width="1200" height="400" rx="12" class="bg"/>

  <!-- Background Grid -->
  <line x1="0" y1="80" x2="1200" y2="80" class="grid-line" />
  <line x1="0" y1="160" x2="1200" y2="160" class="grid-line" />
  <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
  <line x1="0" y1="320" x2="1200" y2="320" class="grid-line" />

  <line x1="200" y1="0" x2="200" y2="400" class="grid-line" />
  <line x1="400" y1="0" x2="400" y2="400" class="grid-line" />
  <line x1="600" y1="0" x2="600" y2="400" class="grid-line" />
  <line x1="800" y1="0" x2="800" y2="400" class="grid-line" />
  <line x1="1000" y1="0" x2="1000" y2="400" class="grid-line" />

  <!-- Animated Pulse Path -->
  <path class="wave-bg" d="M 50 320 L 400 320 L 430 250 L 460 360 L 490 280 L 520 340 L 550 320 L 1150 320" />
  <path class="wave" d="M 50 320 L 400 320 L 430 250 L 460 360 L 490 280 L 520 340 L 550 320 L 1150 320" />

  <!-- Floating Badges -->
  <g class="pill" transform="translate(70, 50)">
    <rect width="140" height="34" rx="17" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="18" cy="17" r="5" fill="#3fb950"/>
    <text x="32" y="22" class="badge-text">99.99% Uptime</text>
  </g>

  <g class="pill-delay" transform="translate(970, 50)">
    <rect width="160" height="34" rx="17" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="18" cy="17" r="5" fill="#58a6ff"/>
    <text x="32" y="22" class="badge-text">Global Monitoring</text>
  </g>

  <g class="pill" transform="translate(930, 270)">
    <rect width="190" height="34" rx="17" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="18" cy="17" r="5" fill="#a371f7"/>
    <text x="32" y="22" class="badge-text">Synthetic Health Checks</text>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(600, 185)" text-anchor="middle">
    <text x="0" y="-45" font-size="40">🏥 📊 ⚡</text>
    <text x="0" y="10" class="title">Cloud Infrastructure Health &amp; Status</text>
    <text x="0" y="48" class="subtitle">Curated Directory of Commercial Platforms, Synthetic Testing &amp; Open-Source Status Pages</text>
  </g>
</svg>

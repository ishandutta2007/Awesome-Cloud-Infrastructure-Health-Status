<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#090d11"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#79c0ff"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>

    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2ea043" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bg-grad); }
    .grid-line { stroke: #30363d; stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.4; }
    
    /* Dynamic Wave & Pulse Animation */
    .wave {
      fill: none;
      stroke: #3fb950;
      stroke-width: 3;
      filter: url(#glow);
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: dash 6s linear infinite;
    }

    .wave-bg {
      fill: none;
      stroke: #238636;
      stroke-width: 1.5;
      opacity: 0.5;
    }

    @keyframes dash {
      to {
        stroke-dashoffset: 0;
      }
    }

    /* Floating Status Pills */
    .pill {
      animation: float 4s ease-in-out infinite alternate;
    }
    .pill-delay {
      animation: float 5s ease-in-out 1s infinite alternate;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }

    /* Pulse Dots */
    .ping {
      animation: ping-anim 2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    @keyframes ping-anim {
      75%, 100% {
        transform: scale(2);
        opacity: 0;
      }
    }

    /* Main Title & Subtitle Styling */
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 48px;
      font-weight: 800;
      fill: url(#text-grad);
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 20px;
      font-weight: 400;
      fill: #8b949e;
      letter-spacing: 0.2px;
    }

    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;
      fill: #e6edf3;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="400" rx="16" class="bg"/>

  <!-- Background Tech Grid Lines -->
  <line x1="0" y1="80" x2="1200" y2="80" class="grid-line" />
  <line x1="0" y1="160" x2="1200" y2="160" class="grid-line" />
  <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
  <line x1="0" y1="320" x2="1200" y2="320" class="grid-line" />

  <line x1="200" y1="0" x2="200" y2="400" class="grid-line" />
  <line x1="400" y1="0" x2="400" y2="400" class="grid-line" />
  <line x1="600" y1="0" x2="600" y2="400" class="grid-line" />
  <line x1="800" y1="0" x2="800" y2="400" class="grid-line" />
  <line x1="1000" y1="0" x2="1000" y2="400" class="grid-line" />

  <!-- Animated Health Status Waveform (Background Component) -->
  <path class="wave-bg" d="M 50 320 Q 150 320 200 320 T 350 320 L 400 320 L 430 260 L 460 360 L 490 280 L 520 340 L 550 320 L 700 320 Q 850 320 950 320 T 1150 320" />
  <path class="wave" d="M 50 320 Q 150 320 200 320 T 350 320 L 400 320 L 430 260 L 460 360 L 490 280 L 520 340 L 550 320 L 700 320 Q 850 320 950 320 T 1150 320" />

  <!-- Decorative Dynamic Status Pills in Background -->
  <g class="pill" transform="translate(80, 60)">
    <rect width="140" height="36" rx="18" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <circle cx="20" cy="18" r="6" fill="#3fb950"/>
    <text x="36" y="23" class="badge-text">99.99% Uptime</text>
  </g>

  <g class="pill-delay" transform="translate(970, 70)">
    <rect width="150" height="36" rx="18" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <circle cx="20" cy="18" r="6" fill="#58a6ff"/>
    <text x="36" y="23" class="badge-text">Global Monitors</text>
  </g>

  <g class="pill" transform="translate(930, 260)">
    <rect width="190" height="36" rx="18" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <circle cx="20" cy="18" r="6" fill="#a371f7"/>
    <text x="36" y="23" class="badge-text">Synthetic Health Checks</text>
  </g>

  <!-- Foreground Title and Subtitle Block -->
  <g transform="translate(600, 175)" text-anchor="middle">
    <!-- Icon / Symbol -->
    <text x="0" y="-55" font-size="42">🏥 📊 ⚡</text>
    
    <!-- Title -->
    <text x="0" y="5" class="title">Cloud Infrastructure Health &amp; Status</text>
    
    <!-- Subtitle -->
    <text x="0" y="45" class="subtitle">Curated Directory of Commercial Platforms, Synthetic Testing &amp; Open-Source Status Pages</text>
  </g>
</svg>
